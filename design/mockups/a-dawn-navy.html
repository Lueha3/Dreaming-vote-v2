<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>동아리드림 — 시안 A · 새벽 기도 (Dawn Navy)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
/* ============================================================
   시안 A — "새벽 기도" (Dawn Navy)
   순수 검정 대신 꿈꾸는교회 로고 하늘색의 '밤 버전' 네이비.
   하단에서 동트는 스카이블루+골드 글로우, 골드 별, 교회 라인아트.
   ============================================================ */
:root{
  --navy-950:#0B1626;
  --navy-900:#0D1D31;
  --navy-800:#102A43;
  --navy-700:#16374F;
  --navy-650:#1B4060;

  --sky-100:#E9F5FC;
  --sky-200:#CCE4F6;
  --sky-400:#7FBDE4;

  --gold:#F0B429;
  --gold-deep:#D99B0B;
  --gold-soft:#F7CE63;

  --mint:#35C3B4;
  --mint-bright:#5FD9CC;

  --charcoal:#3A4149;
  --lineart:#9AA3AD;

  --ink:var(--sky-100);
  --ink-dim:rgba(204,228,246,.62);
  --ink-faint:rgba(204,228,246,.40);

  --line:rgba(127,189,228,.16);
  --line-strong:rgba(127,189,228,.30);
  --glass:rgba(16,42,67,.55);
}

*{margin:0;padding:0;box-sizing:border-box;}

html{scroll-behavior:smooth;}

body{
  font-family:"Pretendard Variable", Pretendard, sans-serif;
  background:linear-gradient(180deg,var(--navy-950) 0%,var(--navy-900) 46%,var(--navy-800) 74%,var(--navy-700) 100%);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

::selection{background:rgba(240,180,41,.35);color:var(--sky-100);}

/* ---------- 배경 레이어: 동트는 글로우 ---------- */
.bg-glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(56rem 26rem at 50% 110%, rgba(240,180,41,.26), rgba(240,180,41,.07) 46%, transparent 72%),
    radial-gradient(92rem 46rem at 50% 120%, rgba(127,189,228,.22), transparent 64%),
    radial-gradient(46rem 30rem at 88% -12%, rgba(127,189,228,.10), transparent 62%),
    radial-gradient(30rem 22rem at 6% 2%, rgba(53,195,180,.05), transparent 60%);
}

/* ---------- 배경 레이어: 밤하늘의 골드 별 ---------- */
.bg-stars{
  position:fixed;inset:0;z-index:0;pointer-events:none;
}
.bg-stars svg{width:100%;height:100%;display:block;}

/* ---------- 헤더 ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(11,22,38,.62);
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1152px;margin:0 auto;
  height:64px;padding:0 28px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;}
.wordmark{
  font-size:19px;font-weight:800;letter-spacing:-0.02em;color:var(--sky-100);
}
.wordmark .blue{
  background:linear-gradient(120deg,var(--sky-400),var(--sky-200));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-x{color:var(--ink-faint);font-size:12px;font-weight:500;}
.church-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(165deg,#E9F5FC 0%,#CCE4F6 100%);
  border:1px solid rgba(233,245,252,.35);
  border-radius:9px;padding:4px 9px 4px 6px;
  box-shadow:0 2px 10px rgba(127,189,228,.18);
}
.church-badge .name{font-size:11px;font-weight:700;color:var(--charcoal);letter-spacing:-0.01em;}

nav{display:flex;align-items:center;gap:6px;font-size:14px;}
nav a{
  color:var(--ink-dim);text-decoration:none;font-weight:500;
  padding:7px 10px;border-radius:9px;
  transition:color .16s ease,background .16s ease;
}
nav a:hover{color:var(--sky-100);background:rgba(127,189,228,.10);}
nav .sep{color:var(--ink-faint);font-size:12px;user-select:none;}
nav .vsep{width:1px;height:16px;background:var(--line-strong);margin:0 8px;}
.pill-warn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid rgba(240,180,41,.45);
  background:rgba(240,180,41,.09);
  color:var(--gold-soft) !important;
  border-radius:999px;padding:6px 13px !important;
  font-weight:600 !important;font-size:13px;
  transition:all .16s ease;
}
.pill-warn:hover{
  background:rgba(240,180,41,.18) !important;
  border-color:rgba(240,180,41,.7);
  color:#FBE3A0 !important;
  box-shadow:0 0 18px rgba(240,180,41,.20);
}
.logout{color:var(--ink-faint) !important;}
.logout:hover{color:var(--sky-200) !important;}

/* ---------- 본문 ---------- */
main{
  position:relative;z-index:1;
  max-width:672px;margin:0 auto;
  padding:76px 24px 0;
  text-align:center;
}

/* 상단 뱃지 */
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid var(--line-strong);
  border-radius:999px;padding:8px 18px;
  font-size:13.5px;font-weight:600;color:var(--sky-200);
  box-shadow:0 4px 24px rgba(4,10,20,.35), inset 0 1px 0 rgba(233,245,252,.07);
}
.hero-badge .dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--mint);
  box-shadow:0 0 10px rgba(53,195,180,.9), 0 0 22px rgba(53,195,180,.45);
}

/* H1 */
h1{
  margin-top:26px;
  font-size:46px;font-weight:800;line-height:1.22;letter-spacing:-0.035em;
  color:var(--sky-100);
  text-wrap:balance;
}
h1 .em{
  position:relative;
  background:linear-gradient(120deg,var(--gold-soft) 0%,var(--gold) 45%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 38px rgba(240,180,41,.35);
}
h1 .em .twinkle{
  position:absolute;top:-9px;right:-17px;width:15px;height:15px;
  filter:drop-shadow(0 0 6px rgba(240,180,41,.8));
}

/* 서브 카피 */
.sub{
  margin-top:18px;
  font-size:17px;line-height:1.75;color:var(--ink-dim);font-weight:450;
}

/* ---------- 메인 카드 ---------- */
.card{
  position:relative;
  margin-top:44px;
  background:linear-gradient(180deg,rgba(23,58,92,.52) 0%,rgba(16,42,67,.42) 100%);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid rgba(127,189,228,.18);
  border-radius:24px;
  padding:36px 32px 30px;
  box-shadow:
    0 28px 70px rgba(4,10,20,.55),
    0 4px 18px rgba(4,10,20,.35),
    inset 0 1px 0 rgba(233,245,252,.08);
  text-align:left;
}
/* 카드 상단 새벽 하이라이트 라인 */
.card::before{
  content:"";position:absolute;top:-1px;left:28px;right:28px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(240,180,41,.65) 32%,rgba(127,189,228,.55) 68%,transparent);
}

.card-head{display:flex;align-items:flex-start;gap:12px;}
.card-head .spark{flex:none;margin-top:3px;filter:drop-shadow(0 0 7px rgba(240,180,41,.55));}
.card-title{font-size:19.5px;font-weight:700;letter-spacing:-0.02em;color:var(--sky-100);}
.card-caption{margin-top:6px;font-size:14px;color:var(--ink-dim);font-weight:450;}

/* MBTI 4x4 격자 */
.mbti-grid{
  margin-top:24px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
}
.mbti-grid button{
  font-family:inherit;
  height:56px;border-radius:14px;cursor:pointer;
  background:rgba(233,245,252,.045);
  border:1px solid rgba(127,189,228,.17);
  color:var(--sky-200);
  font-size:15px;font-weight:700;letter-spacing:.07em;
  transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease,color .16s ease;
}
.mbti-grid button:hover{
  transform:translateY(-2px);
  background:linear-gradient(180deg,rgba(240,180,41,.16),rgba(240,180,41,.05));
  border-color:rgba(240,180,41,.55);
  color:#FBE3A0;
  box-shadow:0 10px 26px rgba(240,180,41,.16), 0 2px 8px rgba(4,10,20,.4);
}
.mbti-grid button:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px;
}
.mbti-grid button:active{transform:translateY(0);}

/* 무료 검사 링크 */
.free-test{
  margin-top:20px;text-align:center;
  font-size:14px;color:var(--ink-dim);
}
.free-test a{
  color:var(--mint-bright);font-weight:600;text-decoration:none;
  border-bottom:1px solid rgba(95,217,204,.0);
  padding-bottom:1px;
  transition:color .16s ease,border-color .16s ease,text-shadow .16s ease;
}
.free-test a:hover{
  color:#8BEADF;border-bottom-color:rgba(95,217,204,.6);
  text-shadow:0 0 16px rgba(53,195,180,.45);
}

/* 구분선 */
.divider{
  margin:24px 0;display:flex;align-items:center;gap:14px;
  color:var(--ink-faint);font-size:12.5px;font-weight:500;
}
.divider::before,.divider::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-strong),transparent);
}

/* 접힌 확장 버튼 */
.expander{
  font-family:inherit;
  width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
  padding:15px 18px;border-radius:14px;cursor:pointer;
  background:rgba(233,245,252,.03);
  border:1px solid var(--line);
  color:var(--ink-dim);font-size:14.5px;font-weight:550;
  transition:all .16s ease;
}
.expander:hover{
  color:var(--sky-100);
  border-color:rgba(127,189,228,.45);
  background:rgba(127,189,228,.07);
  box-shadow:0 6px 22px rgba(4,10,20,.35);
}
.expander .chev{
  font-size:13px;color:var(--ink-faint);transition:color .16s ease,transform .16s ease;
}
.expander:hover .chev{color:var(--sky-400);transform:translateY(2px);}

/* ---------- 하단: 교회 라인아트 지평선 ---------- */
.horizon{
  position:relative;z-index:1;
  max-width:960px;margin:90px auto 0;padding:0 24px;
}
.horizon svg{width:100%;height:auto;display:block;}

footer{
  position:relative;z-index:1;
  text-align:center;
  padding:26px 0 52px;
  font-size:12.5px;color:var(--ink-faint);font-weight:450;
  letter-spacing:.01em;
}
</style>
</head>
<body>

<!-- 동트는 새벽 글로우 -->
<div class="bg-glow" aria-hidden="true"></div>

<!-- 밤하늘 골드 별 -->
<div class="bg-stars" aria-hidden="true">
  <svg viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

    <!-- 잔별 (점) -->
    <g fill="#CCE4F6">
      <circle cx="92"   cy="86"  r="1.4" opacity=".30"/>

    </g>
  </svg>
</div>

<!-- ============ 헤더 ============ -->
<header>
  <div class="header-inner">
    <a class="brand" href="#">
      <span class="wordmark"><span class="blue">Blue</span>Humanity</span>
      <span class="brand-x">×</span>
      <span class="church-badge">
        <!-- 꿈꾸는교회 미니 로고: 교회 + 골드 별 + 민트 포인트 -->
        <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g fill="none" stroke="#9AA3AD" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 2 V4.8"/>
            <path d="M6.7 3.1 H9.3"/>
            <path d="M4.8 13.2 V9 L8 5.8 L11.2 9 V13.2"/>

          </g>
          <path d="M12.7 2.5 C12.95 3.85 13.25 4.15 14.6 4.4 C13.25 4.65 12.95 4.95 12.7 6.3 C12.45 4.95 12.15 4.65 10.8 4.4 C12.15 4.15 12.45 3.85 12.7 2.5 Z" fill="#F0B429"/>
          <rect x="2.2" y="10.4" width="2" height="2" rx=".4" fill="#35C3B4" transform="rotate(10 3.2 11.4)"/>

        <span class="name">꿈꾸는교회</span>
      </span>

    <nav>
      <a href="#">홈</a><span class="sep">·</span>
      <a href="#">기도</a><span class="sep">·</span>

      <a href="#">내 성향 카드</a><span class="sep">·</span>
      <a href="#">내 동아리</a><span class="sep">·</span>
      <a href="#" class="pill-warn">닉네임 설정 ⚠️</a>
      <span class="vsep"></span>
      <a href="#" class="logout">로그아웃</a>
    </nav>
  </div>
</header>

<!-- ============ 본문 ============ -->
<main>

  <!-- 상단 뱃지 -->
  <div class="hero-badge">
    <span class="dot"></span>
    꿈꾸는교회 청년부 · 나에게 맞는 동아리
  </div>

  <!-- H1 -->
  <h1>
    나에게 맞는<br/>
    <span class="em">동아리<svg class="twinkle" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 0 C10.2 6.3 11.7 7.8 18 9 C11.7 10.2 10.2 11.7 9 18 C7.8 11.7 6.3 10.2 0 9 C6.3 7.8 7.8 6.3 9 0 Z" fill="#F0B429"/></svg></span>를 찾아보세요
  </h1>

  <!-- 서브 카피 -->
  <p class="sub">
    성격유형을 안다면 1분이면 충분해요.<br/>
    AI가 내 성향에 맞는 동아리를 추천해드려요.
  </p>

  <!-- 메인 카드 -->
  <section class="card">
    <div class="card-head">
      <svg class="spark" width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M10 1 C11.3 7 13 8.7 19 10 C13 11.3 11.3 13 10 19 C8.7 13 7 11.3 1 10 C7 8.7 8.7 7 10 1 Z" fill="url(#goldGrad)"/>

          <linearGradient id="goldGrad" x1="0" y1="0" x2="20" y2="20">
            <stop offset="0" stop-color="#F7CE63"/>
            <stop offset="1" stop-color="#D99B0B"/>
          </linearGradient>
        </defs>
      </svg>
      <div>
        <h2 class="card-title">성격유형을 고르면 바로 시작해요</h2>
        <p class="card-caption">대충 골라도 괜찮아요 — 나중에 다시 만들 수 있어요</p>
      </div>
    </div>

    <!-- 4×4 성격유형 격자 -->
    <div class="mbti-grid">
      <button type="button">INTJ</button><button type="button">INTP</button><button type="button">ENTJ</button><button type="button">ENTP</button>
      <button type="button">INFJ</button><button type="button">INFP</button><button type="button">ENFJ</button><button type="button">ENFP</button>
      <button type="button">ISTJ</button><button type="button">ISFJ</button><button type="button">ESTJ</button><button type="button">ESFJ</button>
      <button type="button">ISTP</button><button type="button">ISFP</button><button type="button">ESTP</button><button type="button">ESFP</button>

      ChatGPT 등 AI를 써봤다면 — 더 깊게 분석하기
      <span class="chev">⌄</span>
    </button>
  </section>

</main>

<!-- ============ 하단: 새벽 지평선 위 교회 라인아트 ============ -->

  <svg viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <path id="hsp" d="M0 -9 C1.3 -2.6 2.6 -1.3 9 0 C2.6 1.3 1.3 2.6 0 9 C-1.3 2.6 -2.6 1.3 -9 0 C-2.6 -1.3 -1.3 -2.6 0 -9 Z"/>

    <!-- 먼 집들 (희미하게) -->
    <g fill="none" stroke="#7FBDE4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".38">
      <path d="M120 206 V182 L150 168 L180 182 V206"/>
      <path d="M158 192 H172 M132 192 H146"/>
      <path d="M700 206 V178 L734 162 L768 178 V206"/>
      <path d="M712 190 H726 M742 190 H756"/>
    </g>

    <!-- 교회 본체 (라인아트, 로고의 회색 선) -->

      <!-- 종탑 -->
      <path d="M432 92 V206"/>
      <path d="M468 92 V206"/>
      <path d="M426 92 L450 56 L474 92 Z"/>
      <!-- 십자가 -->
