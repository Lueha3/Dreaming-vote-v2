<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>동아리드림 — 시안 B · 스테인드글라스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  /* ============================================================
     동아리드림 — Direction B "Stained Glass"
     무드: 오후 햇살이 예배당 창을 통과해 들어온다.
     팔레트: 꿈꾸는교회 로고 (하늘 / 골드 / 민트 / 차콜) 의 밤 버전
     ============================================================ */
  :root {
    --bg-0: #0A1622;          /* 가장 깊은 미드나잇 네이비 (로고 하늘색의 밤) */
    --bg-1: #0E2136;
    --bg-2: #132943;
    --ink: #EAF3FA;
    --muted: #A8C0D4;
    --faint: #6E8AA1;
    --gold: #F0B429;
    --gold-deep: #D99B0B;
    --gold-pale: #FFE3A1;
    --sky: #7FBDE4;
    --sky-pale: #CCE4F6;
    --mist: #E9F5FC;
    --teal: #35C3B4;
    --teal-pale: #9FF0E7;
    --lead: #0A1322;          /* 스테인드글라스 납선(lead line) */
    --glass-bg: rgba(17, 35, 56, 0.66);
    --glass-line: rgba(170, 205, 235, 0.14);
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: "Pretendard Variable", Pretendard, sans-serif;
    background: var(--bg-0);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(1100px 520px at 50% -120px, rgba(127, 189, 228, 0.14), transparent 65%),
      radial-gradient(900px 600px at 12% 30%, rgba(240, 180, 41, 0.05), transparent 60%),
      radial-gradient(900px 600px at 88% 36%, rgba(53, 195, 180, 0.05), transparent 60%),
      linear-gradient(180deg, #0B1A2C 0%, #0E2136 38%, #0A1622 100%);
    overflow-x: hidden;
  }

  ::selection { background: rgba(240, 180, 41, 0.35); color: #fff; }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ------------------------------------------------------------
     배경 무대: 스테인드글라스 창 2개 + 빛줄기 + 부유 장식
     ------------------------------------------------------------ */
  .scene {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .window {
    position: absolute;
    top: 128px;
    width: 220px;
    opacity: 0.92;
  }
  .window--left  { left: clamp(16px, 5vw, 84px); }
  .window--right { right: clamp(16px, 5vw, 84px); }

  /* 유리 너머에서 새어드는 글로우 */
  .window::before {
    content: "";
    position: absolute;
    inset: -70px;
    background: radial-gradient(closest-side, rgba(240, 196, 84, 0.16), transparent 72%);
    filter: blur(8px);
    z-index: -1;
  }
  .window--right::before {
    background: radial-gradient(closest-side, rgba(127, 189, 228, 0.18), transparent 72%);
  }

  /* 빛이 유리를 통과해 본문 쪽으로 떨어지는 light beam */
  .beam {
    position: absolute;
    top: 150px;
    width: 240px;
    height: 820px;
    filter: blur(22px);
  }
  .beam--left {
    left: clamp(40px, 7vw, 120px);
    background: linear-gradient(192deg, rgba(240, 196, 84, 0.17) 0%, rgba(240, 196, 84, 0.05) 45%, transparent 72%);
    transform: rotate(17deg);
    transform-origin: top left;
  }
  .beam--right {
    right: clamp(40px, 7vw, 120px);
    background: linear-gradient(168deg, rgba(127, 189, 228, 0.16) 0%, rgba(53, 195, 180, 0.05) 45%, transparent 72%);
    transform: rotate(-17deg);
    transform-origin: top right;
  }
  /* 중앙 제단 쪽으로 떨어지는 은은한 세로 빛 */
  .beam--center {
    left: 50%;
    top: 60px;
    width: 560px;
    height: 560px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(233, 245, 252, 0.07), transparent 75%);
    filter: blur(10px);
  }

  /* 떠 있는 골드 별 / 민트 사각 포인트 (로고 모티프) */
  .mote { position: absolute; }
  .mote svg { display: block; }
  .mote--1 { top: 210px;  left: 27%;  opacity: .55; }
  .mote--2 { top: 470px;  right: 24%; opacity: .4; }
  .mote--3 { top: 660px;  left: 19%;  opacity: .35; }
  .mote--sq1 { top: 320px; right: 30%; opacity: .55; transform: rotate(18deg); }
  .mote--sq2 { top: 760px; left: 30%;  opacity: .4;  transform: rotate(-12deg); }

  /* ------------------------------------------------------------
     헤더 (sticky · 글래스)
     ------------------------------------------------------------ */
  .header {
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    background: linear-gradient(180deg, rgba(10, 22, 34, 0.78), rgba(10, 22, 34, 0.55));
    border-bottom: 1px solid rgba(170, 205, 235, 0.10);
  }
  .header__inner {
    max-width: 1180px;
    margin: 0 auto;
    height: 64px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand__wordmark {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .brand__wordmark .blue { color: var(--sky); }
  .brand__x {
    color: var(--faint);
    font-size: 11px;
    font-weight: 500;
  }
  .brand__church {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 11px 5px 6px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(233, 245, 252, 0.10), rgba(204, 228, 246, 0.05));
    border: 1px solid rgba(204, 228, 246, 0.18);
    font-size: 12px;
    font-weight: 600;
    color: var(--sky-pale);
    letter-spacing: -0.01em;
  }
  .brand__church svg { display: block; }

  .nav {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
  }
  .nav a.nav__link {
    padding: 7px 10px;
    border-radius: 10px;
    transition: color .18s ease, background .18s ease;
  }
  .nav a.nav__link:hover {
    color: var(--ink);
    background: rgba(127, 189, 228, 0.10);
  }
  .nav .sep { color: rgba(110, 138, 161, 0.55); font-size: 11px; user-select: none; }

  .nav__warn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 13px;
    margin: 0 2px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: #F6CB66;
    background: linear-gradient(135deg, rgba(240, 180, 41, 0.16), rgba(217, 155, 11, 0.08));
    border: 1px solid rgba(240, 180, 41, 0.38);
    transition: box-shadow .18s ease, border-color .18s ease, transform .18s ease;
  }
  .nav__warn:hover {
    border-color: rgba(240, 180, 41, 0.65);
    box-shadow: 0 0 18px rgba(240, 180, 41, 0.22);
    transform: translateY(-1px);
  }
  .nav__divider {
    width: 1px;
    height: 16px;
    background: rgba(170, 205, 235, 0.18);
    margin: 0 6px;
  }
  .nav__logout {
    color: var(--faint);
    padding: 7px 10px;
    border-radius: 10px;
    transition: color .18s ease;
  }
  .nav__logout:hover { color: var(--muted); }

  /* ------------------------------------------------------------
     본문 (672px 중앙)
     ------------------------------------------------------------ */
  .main {
    position: relative;
    z-index: 1;
    max-width: 672px;
    margin: 0 auto;
    padding: 72px 16px 80px;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #BFDCF1;
    background: linear-gradient(135deg, rgba(127, 189, 228, 0.12), rgba(53, 195, 180, 0.06));
    border: 1px solid rgba(127, 189, 228, 0.26);
    box-shadow: 0 0 26px rgba(127, 189, 228, 0.10);
  }
  .badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px rgba(240, 180, 41, 0.9);
  }

  .h1 {
    margin-top: 28px;
    font-size: 44px;
    line-height: 1.28;
    font-weight: 800;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }
  .h1 em {
    font-style: normal;
    position: relative;
    background: linear-gradient(115deg, var(--gold-pale) 0%, var(--gold) 45%, var(--gold-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  /* 단어 뒤에 깔리는 스테인드글라스 조각 하이라이트 */
  .h1 em::after {
    content: "";
    position: absolute;
    left: -4px;
    right: -4px;
    bottom: 2px;
    height: 14px;
    background: linear-gradient(90deg, rgba(240, 180, 41, 0.22), rgba(53, 195, 180, 0.16));
    transform: skewX(-12deg);
    border-radius: 3px;
    z-index: -1;
    filter: blur(1px);
  }

  .sub {
    margin-top: 18px;
    font-size: 16.5px;
    line-height: 1.7;
    font-weight: 450;
    color: var(--muted);
    letter-spacing: -0.012em;
  }
  .sub strong { color: #CBE0F0; font-weight: 600; }

  /* ------------------------------------------------------------
     메인 카드 (글래스 + 라운드 24px)
     ------------------------------------------------------------ */
  .card {
    position: relative;
    margin-top: 44px;
    padding: 36px 32px 30px;
    border-radius: var(--radius-lg);
    background: linear-gradient(168deg, rgba(20, 40, 64, 0.74), rgba(13, 28, 47, 0.78));
    border: 1px solid var(--glass-line);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow:
      0 24px 70px rgba(3, 9, 18, 0.55),
      inset 0 1px 0 rgba(233, 245, 252, 0.07);
    overflow: hidden;
    text-align: center;
  }
  /* 카드 위를 비스듬히 지나는 햇살 한 줄기 */
  .card::before {
    content: "";
    position: absolute;
    top: -40%;
    left: -20%;
    width: 60%;
    height: 180%;
    background: linear-gradient(100deg, transparent 30%, rgba(233, 245, 252, 0.045) 50%, transparent 70%);
    transform: rotate(8deg);
    pointer-events: none;
  }
  .card__facets {
    position: absolute;
    top: 0;
    right: 0;
    opacity: 0.9;
    pointer-events: none;
  }

  .card__title {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.025em;
  }
  .card__caption {
    margin-top: 9px;
    font-size: 13.5px;
    color: var(--faint);
    letter-spacing: -0.01em;
  }

  /* ---- MBTI 4×4 격자: 스테인드글라스 조각 ---- */
  .grid {
    margin-top: 26px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .mbti {
    position: relative;
    padding: 17px 0;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 650;
    letter-spacing: 0.05em;
    color: #C5D8E8;
    background: rgba(127, 189, 228, 0.045);
    border: 1px solid rgba(170, 205, 235, 0.13);
    /* 안쪽 어두운 림 = 납선 느낌 */
    box-shadow: inset 0 0 0 1px rgba(6, 14, 24, 0.45);
    transition:
      background .2s ease,
      border-color .2s ease,
      color .2s ease,
      box-shadow .2s ease,
      transform .2s ease;
  }
  /* 기본 상태: 조각마다 미세하게 다른 유리 색 (차분하게) */
  .mbti:nth-child(3n+1) { background: rgba(240, 180, 41, 0.05); }
  .mbti:nth-child(3n+2) { background: rgba(127, 189, 228, 0.06); }
  .mbti:nth-child(3n)   { background: rgba(53, 195, 180, 0.05); }

  /* hover: 빛이 통과하며 점등 — 골드 / 스카이 / 틸 */
  .mbti:nth-child(3n+1):hover {
    background: radial-gradient(120% 130% at 50% 0%, rgba(240, 180, 41, 0.30), rgba(217, 155, 11, 0.10));
    border-color: rgba(240, 180, 41, 0.72);
    color: var(--gold-pale);
    box-shadow:
      0 0 26px rgba(240, 180, 41, 0.28),
      inset 0 0 18px rgba(240, 180, 41, 0.16);
    transform: translateY(-2px);
  }
  .mbti:nth-child(3n+2):hover {
    background: radial-gradient(120% 130% at 50% 0%, rgba(127, 189, 228, 0.30), rgba(127, 189, 228, 0.09));
    border-color: rgba(127, 189, 228, 0.75);
    color: var(--sky-pale);
    box-shadow:
      0 0 26px rgba(127, 189, 228, 0.28),
      inset 0 0 18px rgba(127, 189, 228, 0.16);
    transform: translateY(-2px);
  }
  .mbti:nth-child(3n):hover {
    background: radial-gradient(120% 130% at 50% 0%, rgba(53, 195, 180, 0.28), rgba(53, 195, 180, 0.08));
    border-color: rgba(53, 195, 180, 0.72);
    color: var(--teal-pale);
    box-shadow:
      0 0 26px rgba(53, 195, 180, 0.26),
      inset 0 0 18px rgba(53, 195, 180, 0.15);
    transform: translateY(-2px);
  }
  .mbti:active { transform: translateY(0); }

  /* ---- 무료 검사 링크 ---- */
  .alt-link {
    margin-top: 20px;
    font-size: 13.5px;
    color: var(--faint);
    letter-spacing: -0.01em;
  }
  .alt-link a {
    color: #54D9C9;
    font-weight: 650;
    margin-left: 5px;
    padding-bottom: 2px;
    border-bottom: 1px solid rgba(53, 195, 180, 0.35);
    transition: color .18s ease, border-color .18s ease, text-shadow .18s ease;
  }
  .alt-link a:hover {
    color: var(--teal-pale);
    border-color: rgba(53, 195, 180, 0.85);
    text-shadow: 0 0 14px rgba(53, 195, 180, 0.45);
  }
  .alt-link .arrow { font-size: 12px; }

  /* ---- 구분선 "또는" ---- */
  .divider {
    margin: 26px 0 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--faint);
    font-size: 12.5px;
    font-weight: 500;
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(170, 205, 235, 0.20));
  }
  .divider::after {
    background: linear-gradient(90deg, rgba(170, 205, 235, 0.20), transparent);
  }

  /* ---- 접힌 확장 버튼 ---- */
  .expander {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 20px;
    border-radius: var(--radius-md);
    background: rgba(127, 189, 228, 0.05);
    border: 1px solid rgba(170, 205, 235, 0.14);
    color: var(--muted);
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: -0.012em;
    transition: background .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .expander strong {
    font-weight: 700;
    background: linear-gradient(100deg, var(--sky-pale), var(--sky));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .expander svg { transition: transform .2s ease; flex: none; }
  .expander:hover {
    background: rgba(127, 189, 228, 0.10);
    border-color: rgba(127, 189, 228, 0.40);
    color: #C9DEEF;
    box-shadow: 0 0 24px rgba(127, 189, 228, 0.12);
  }
  .expander:hover svg { transform: translateY(2px); }

  /* ------------------------------------------------------------
     푸터 장식: 교회 라인아트 + 별
     ------------------------------------------------------------ */
  .footer-art {
    position: relative;
    z-index: 1;
    margin: 40px auto 0;
    max-width: 672px;
    padding: 0 16px 64px;
    text-align: center;
  }
  .footer-art svg { display: block; margin: 0 auto; }
  .footer-art__caption {
    margin-top: 22px;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: rgba(110, 138, 161, 0.75);
    font-weight: 500;
  }
</style>
</head>
<body>

  <!-- ==================== 배경 무대 ==================== -->
  <div class="scene" aria-hidden="true">

    <!-- 왼쪽 스테인드글라스 창 (골드 중심) -->
    <div class="window window--left">
      <svg width="220" height="520" viewBox="0 0 220 520" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="archL">
            <path d="M14 506 L14 196 C14 96 46 38 110 18 C174 38 206 96 206 196 L206 506 Z"/>
          </clipPath>
        </defs>
        <g clip-path="url(#archL)">
          <rect x="14" y="14" width="192" height="492" fill="#11263D" opacity="0.85"/>
          <!-- 상단 아치 -->
          <rect x="14" y="14" width="192" height="156" fill="#7FBDE4" opacity="0.20"/>
          <circle cx="110" cy="96" r="38" fill="#F0B429" opacity="0.42"/>
          <circle cx="110" cy="96" r="15" fill="#35C3B4" opacity="0.45"/>
          <!-- 2행 -->
          <rect x="14"  y="170" width="64" height="115" fill="#F0B429" opacity="0.30"/>
          <rect x="78"  y="170" width="64" height="115" fill="#7FBDE4" opacity="0.26"/>
          <rect x="142" y="170" width="64" height="115" fill="#35C3B4" opacity="0.26"/>
          <!-- 3행 -->
          <rect x="14"  y="285" width="64" height="115" fill="#35C3B4" opacity="0.22"/>
          <rect x="78"  y="285" width="64" height="115" fill="#F0B429" opacity="0.34"/>
          <rect x="142" y="285" width="64" height="115" fill="#7FBDE4" opacity="0.24"/>
          <!-- 4행 -->
          <rect x="14"  y="400" width="64" height="106" fill="#7FBDE4" opacity="0.18"/>
          <rect x="78"  y="400" width="64" height="106" fill="#35C3B4" opacity="0.22"/>
          <rect x="142" y="400" width="64" height="106" fill="#F0B429" opacity="0.26"/>
          <!-- 빛 줄기 (유리 안쪽) -->
          <polygon points="40,14 96,14 206,360 206,470" fill="#E9F5FC" opacity="0.06"/>
          <!-- 납선 -->
          <g stroke="#0A1322" stroke-width="5" fill="none">
            <line x1="14" y1="170" x2="206" y2="170"/>
            <line x1="14" y1="285" x2="206" y2="285"/>
            <line x1="14" y1="400" x2="206" y2="400"/>
            <line x1="78"  y1="170" x2="78"  y2="506"/>
            <line x1="142" y1="170" x2="142" y2="506"/>
            <circle cx="110" cy="96" r="38"/>
            <circle cx="110" cy="96" r="15"/>
          </g>
        </g>
        <!-- 외곽 납선 + 옅은 하이라이트 -->
        <path d="M14 506 L14 196 C14 96 46 38 110 18 C174 38 206 96 206 196 L206 506"
              fill="none" stroke="#0A1322" stroke-width="7"/>
        <path d="M14 506 L14 196 C14 96 46 38 110 18 C174 38 206 96 206 196 L206 506"
              fill="none" stroke="rgba(204,228,246,0.28)" stroke-width="1.5"/>
      </svg>
    </div>

    <!-- 오른쪽 스테인드글라스 창 (스카이/틸 중심) -->
    <div class="window window--right">
      <svg width="220" height="520" viewBox="0 0 220 520" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="archR">
            <path d="M14 506 L14 196 C14 96 46 38 110 18 C174 38 206 96 206 196 L206 506 Z"/>
          </clipPath>
        </defs>
        <g clip-path="url(#archR)">
          <rect x="14" y="14" width="192" height="492" fill="#11263D" opacity="0.85"/>
          <rect x="14" y="14" width="192" height="156" fill="#35C3B4" opacity="0.14"/>
          <circle cx="110" cy="96" r="38" fill="#7FBDE4" opacity="0.40"/>
          <circle cx="110" cy="96" r="15" fill="#F0B429" opacity="0.50"/>
          <rect x="14"  y="170" width="64" height="115" fill="#35C3B4" opacity="0.26"/>
          <rect x="78"  y="170" width="64" height="115" fill="#F0B429" opacity="0.28"/>
          <rect x="142" y="170" width="64" height="115" fill="#7FBDE4" opacity="0.28"/>
